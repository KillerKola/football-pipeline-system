services:
  postgres:
    image: postgres:17
    container_name: football-postgres
    environment:
      POSTGRES_DB: metabase_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5544:5432"
    volumes:
      - ../postgres-data:/var/lib/postgresql/data
      - ./metabase_app.dump:/backups/metabase_app.dump
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: metabase-football-stats
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: postgres
      MB_DB_PASS: postgres
      MB_DB_HOST: postgres
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    restart: unless-stopped

  prefect-runner:
    image: prefecthq/prefect:3-latest
    container_name: prefect-runner
    depends_on:
      - prefect-server
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    working_dir: /app
    volumes:
      - ..:/app
    command: python prefect/pipeline_flow.py
    restart: unless-stopped